odoo.url=${ODOO_URL:http://localhost:18080}
odoo.database=${ODOO_DATABASE:sqq}
odoo.login=${ODOO_LOGIN:demo}
odoo.password=${ODOO_PASSWORD:demo}

# Quinoa — Vite/Vue front in src/main/webui, launched in dev mode
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=20.11.1
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.dev-server.check-timeout=60000
quarkus.quinoa.enable-spa-routing=true

# Quinoa is noisy at boot; disable in tests
%test.quarkus.quinoa.enabled=false

# OpenAPI / Swagger exposed for orval
quarkus.swagger-ui.always-include=true
# Write the OpenAPI contract to disk on every build / dev reload so that
# orval can regenerate the typed client from a file (no need for the
# Quarkus server to be reachable when the frontend builds).
quarkus.smallrye-openapi.store-schema-directory=src/main/webui/openapi
quarkus.smallrye-openapi.store-schema-file-name=openapi
