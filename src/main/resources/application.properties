odoo.url=${ODOO_URL:http://localhost:18080}
odoo.database=${ODOO_DATABASE:sqq}
odoo.login=${ODOO_LOGIN:demo}
odoo.password=${ODOO_PASSWORD:demo}

# Cap request bodies: the only sizeable input is a photo upload (a ~512px JPEG ≈ tens of KB).
# 4M leaves generous headroom while bounding the single write path to production Odoo.
quarkus.http.limits.max-body-size=4M

# Odoo stamps a generic grey "no photo" silhouette on res.partner.image for many imported
# cooperators. We must treat that placeholder as *no* photo, otherwise the detail screen shows the
# silhouette and the capture button reads "Reprendre la photo" instead of "Prendre une photo".
# A placeholder is recognised by the SHA-256 of its DECODED image bytes (immune to base64 wrapping).
# Comma-separated, so a different default per environment can be added without a code change.
# Value below = the 180×180 grey silhouette observed on the staging Odoo.
sesame.photo.placeholder-sha256=96d65b90d8638ff7fb8951805598c29cc9a65b4eb44862125768bdb19cd968b5
# Tests designate a small throwaway PNG as "the placeholder" (see MemberDetailTest).
%test.sesame.photo.placeholder-sha256=fe73d06ecfc20dd78064a0f50537cda9a922a095468b1f8ce2b9edc8829b6ffd

# Quinoa — Vite/Vue front in src/main/webui, launched in dev mode
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=20.11.1
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.dev-server.check-timeout=60000
quarkus.quinoa.enable-spa-routing=true

# Quinoa is noisy at boot; disable in tests
%test.quarkus.quinoa.enabled=false

# OpenAPI / Swagger exposed for orval
quarkus.swagger-ui.always-include=true
# Write the OpenAPI contract to disk on every build / dev reload so that
# orval can regenerate the typed client from a file (no need for the
# Quarkus server to be reachable when the frontend builds).
quarkus.smallrye-openapi.store-schema-directory=src/main/webui/openapi
quarkus.smallrye-openapi.store-schema-file-name=openapi
